# SPDM 响应端例程的 Kconfig。请求方例程的 prj.conf 与本文件相同：
# USB / MCTP / libspdm / mbedtls 需求一样，差别只在 C 源码里的 SPDM 角色。

# USB device next：本板当 gadget，枚举成 MCTP USB class（VID 2FE3 PID 0001）。
CONFIG_USB_DEVICE_STACK_NEXT=y

# libmctp + USB binding。pkt_size 在 main.c 里改成 251，避免 USB-MCTP 单包超 255。
CONFIG_MCTP=y
CONFIG_MCTP_USB=y
# 打开 samples/spdm/spdm_modules：编入 responder_lib / requester_lib / cryptlib_mbedtls。
CONFIG_LIBSPDM=y

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
# USB / UDC / MCTP 驱动日志太多，压到 ERR，只留本 sample 的 INF。
CONFIG_MCTP_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_LOG_LEVEL_ERR=y

# libspdm 源码用了 C11 匿名结构体等。
CONFIG_STD_C11=y

# libspdm 上下文 + scratch + 证书链解析栈很深，默认 main 栈不够。
CONFIG_MAIN_STACK_SIZE=32768
# k_malloc：libspdm context（约几十 KB）+ scratch + mbedtls 解析证书。
CONFIG_HEAP_MEM_POOL_SIZE=196608
# ECDHE / nonce 需要随机数。没有硬件熵源时用测试发生器，量产要换成真 RNG。
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y

# 密码：Zephyr 自带 mbedtls，libspdm 的 cryptlib_mbedtls 链到这一套。
# 必须和 spdm_modules 用同一份 MBEDTLS_CONFIG_FILE，否则 GCM 上下文大小
# 不一致，FINISH 之后会 Instruction Access fault。
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536
# 本例程走传统 mbedtls API，不要 PSA 包装。
CONFIG_MBEDTLS_USE_PSA_CRYPTO=n

# 补 ECDSA / X509 等 libspdm 需要、Zephyr 默认没开的 mbedtls 开关。
# 文件在 samples/spdm/spdm_modules/mbedtls_user_config.h。
CONFIG_MBEDTLS_USER_CONFIG_ENABLE=y
CONFIG_MBEDTLS_USER_CONFIG_FILE="mbedtls_user_config.h"

# 部分板级启动代码用 GNU 风格的静态构造。
CONFIG_STATIC_INIT_GNU=y
