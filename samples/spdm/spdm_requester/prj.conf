# SPDM 请求端例程的 Kconfig。
# USB 仍是 gadget，和响应方例程同一套配置；SPDM 角色在 src/main.c 里才分叉。
# 改这里的栈/堆/mbedtls 时，两边请保持一致，否则一边能编过另一边可能栈溢出。

# USB device next：本板当 gadget。主机 Python 是 USB host + SPDM responder。
CONFIG_USB_DEVICE_STACK_NEXT=y

CONFIG_MCTP=y
CONFIG_MCTP_USB=y
CONFIG_LIBSPDM=y

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_MCTP_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_LOG_LEVEL_ERR=y

CONFIG_STD_C11=y

# 请求方一次跑完 VCA + CERT + KEY_EX + 事件订阅，栈和堆不能比响应方更小。
CONFIG_MAIN_STACK_SIZE=32768
CONFIG_HEAP_MEM_POOL_SIZE=196608
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y

CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536
CONFIG_MBEDTLS_USE_PSA_CRYPTO=n

CONFIG_MBEDTLS_USER_CONFIG_ENABLE=y
CONFIG_MBEDTLS_USER_CONFIG_FILE="mbedtls_user_config.h"

CONFIG_STATIC_INIT_GNU=y
