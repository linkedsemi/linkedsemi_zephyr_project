# AF_UNIX large data transfer test configuration
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_AF_UNIX=y
CONFIG_NET_UNIX_BUFFER_SIZE=4096
CONFIG_NET_UNIX_MAX_SOCKETS=16
